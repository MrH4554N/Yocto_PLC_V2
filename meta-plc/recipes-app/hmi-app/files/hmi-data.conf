# Thư mục dữ liệu của HMI trên phân vùng /data.
# hmi-app chạy dưới user weston (xem hmi-app.service) nên phải cấp quyền ghi
# cho user đó; systemd-tmpfiles chạy sau local-fs.target, tức là sau data.mount.
d /data              0755 root   root   -
d /data/telemetry    0755 weston weston -
d /data/events       0755 weston weston -
